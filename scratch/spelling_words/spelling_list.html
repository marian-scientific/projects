<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Spelling Words</title>
		<style>
body, html {
	margin: 0;
	padding: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	background-color: #0a0a0a; /* Dark background */
}

	svg {
		display: block;
		width: 100vw;
		height: 100vh;
	}

	text {
		font-family: 'Segoe UI', sans-serif;
		font-weight: bold;
		user-select: none;
		transition: opacity 2s ease-in-out, transform 10s linear;
		transform-origin: center;
	}

	#ui-layer {
		position: absolute;
		top: 20px;
		left: 20px;
		z-index: 100;
		display: flex;
		gap: 10px;
		opacity: 0.1;
		transition: opacity 0.3s;
	}

	#ui-layer:hover {
		opacity: 1;
	}

	input {
		background: rgba(255, 255, 255, 0.1);
		border: 1px solid #444;
		color: white;
		padding: 8px;
		border-radius: 4px;
		outline: none;
	}

	button {
		background: #444;
		color: white;
		border: none;
		padding: 8px 12px;
		cursor: pointer;
		border-radius: 4px;
	}
		</style>
	</head>
	<body>

		<div id="ui-layer">
			<input type="text" id="wordInput" placeholder="Add a word and press Enter...">
			<button onclick="clearWords()">Clear All</button>
			<div id="wordCounter">0 words loaded</div>
		</div>

		<svg id="canvas"></svg>

		<script>
			const svg = document.getElementById('canvas');

			let words = ["pull", "after", "they", "friend", "know", "every", "going", "when", "some", "ask", "old", "again", "thank", "give", "from"];
			const input = document.getElementById('wordInput');
			const counter = document.getElementById('wordCounter');
			const maxWordsOnScreen = 25;
			const spawnRate = 1000;

			const updateCounter = () => {
				counter.innerText = `${words.length} words in rotation`;
				counter.style.color = words.length > 0 ? "#888" : "#ff4444";
			};

			// Listen for the "Enter" key
			input.addEventListener('keypress', (e) => {
				if (e.key === 'Enter' && input.value.trim() !== "") {
					words.push(input.value.trim());
					input.value = "";
					updateCounter();
				}
			});

			function clearWords() {
				words = [];
				updateCounter();
			}


			function createWord() {
				if (words.length === 0 || svg.children.length > maxWordsOnScreen) return;

				const textNode = document.createElementNS("http://www.w3.org/2000/svg", "text");

				// Randomize properties
				const word = words[Math.floor(Math.random() * words.length)];
				const fontSize = Math.floor(Math.random() * 80) + 60;
				const x = Math.random() * 85 + 10 + "%";
				const y = Math.random() * 90 + 5 + "%";

				const hue = Math.floor(Math.random() * 360);
				const color = `hsl(${hue}, 70%, 60%)`; // Vivid, bright colors
				textNode.setAttribute("fill", color);

				textNode.textContent = word;
				textNode.setAttribute("x", x);
				textNode.setAttribute("y", y);
				textNode.setAttribute("fill", color);
				textNode.setAttribute("font-size", fontSize + "px");
				textNode.setAttribute("text-anchor", "middle");
				textNode.style.opacity = "0";

				svg.appendChild(textNode);

				setTimeout(() => {
					textNode.style.opacity = Math.random() * 0.3 + 0.7;
				}, 50);


				// Inside the createWord() function, after you've created textNode:

				// 1. Randomize the "drift" distance
				const moveX = (Math.random() - 0.5) * 400; // Drifts between -50px and 50px
				const moveY = (Math.random() - 0.5) * 400; // Drifts between -50px and 50px
				const duration = Math.random() * 5 + 5;    // 5 to 10 seconds

				setTimeout(() => {
					// Fade in
					textNode.style.opacity = Math.random() * 0.7 + 0.3;
					// Move toward the random destination
					textNode.style.transform = `translate(${moveX}px, ${moveY}px)`;
				}, 50);



				setTimeout(() => {
					textNode.style.opacity = "0";
					setTimeout(() => {
						textNode.remove();
					}, 1000); 
				}, duration*1000);
			}

			setInterval(createWord, spawnRate);

			window.addEventListener('resize', () => {
			});
		</script>
	</body>
</html>
